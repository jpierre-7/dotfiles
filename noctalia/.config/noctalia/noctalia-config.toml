[bar.default]
capsule = true
center = [ "group:g1" ]
color = "secondary"
end = [ "notifications", "clipboard", "network", "bluetooth", "brightness", "battery", "control-center", "session" ]
font_family = "Maple Mono"
icon_color = "primary"
start = [ "launcher", "wallpaper", "workspaces", "group:g2" ]
widget_spacing = 10

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "date", "clock" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "media", "volume" ]
    opacity = 1.0
    padding = 6.0

[calendar]
enabled = true

[lockscreen_widgets]
enabled = false
schema_version = 2

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

[notification]
history_retention_hours = 24

[plugins]
enabled = [ "noctalia/bitwarden", "noctalia/bongocat" ]

[shell]
font_family = "Maple Mono"

[theme]
builtin = "Gruvbox"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "/home/john/Pictures/Wallpapers/armored_girl.png"

[widget.clock]
format = "{:%I:%M %p}"

[widget.media]
max_length = 100
title_scroll = "always"
